name: Build & Release

# 推 tag (v*) 自动构建三平台安装包并发布 Release；
# 也可在 Actions 页面手动触发（workflow_dispatch）构建但不发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "发布到 Releases（tag 推送时自动为 true）"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # NOTE: libappindicator3-dev and libayatana-appindicator3-dev
          # conflict with each other - install only the modern one.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            file \
            libxdo-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ matrix.target }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ matrix.target }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Check (typecheck + tests)
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      # tag 推送时，把 tauri.conf.json 的版本同步成 tag 里的版本号
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          python3 - <<EOF
          import json, pathlib
          p = pathlib.Path("src-tauri/tauri.conf.json")
          cfg = json.loads(p.read_text())
          cfg["version"] = "$VERSION"
          p.write_text(json.dumps(cfg, indent=2) + "\n")
          EOF

      - name: Build
        run: npm run tauri build

      # Collect the installers so the publish job can attach them to a
      # single release. Building and publishing are separate jobs on purpose:
      # a matrix job that publishes on its own races with its siblings and
      # ends up creating several draft releases.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p installers
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} installers/ \;
          # macOS: also ship the .app bundle as a tar.gz
          for app in src-tauri/target/*/release/bundle/macos/*.app; do
            [ -e "$app" ] || continue
            tar -czf "installers/$(basename "$app").tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
          done
          ls -la installers

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: installers/
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List installers
        run: ls -la installers

      # A single job creates the release, so there is exactly one release per
      # tag no matter how many platforms were built.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RHead ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: installers/*
